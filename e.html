<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 | PLAYGROUND</title>

    <style>
        /* =========================================================
           DESIGN SYSTEM
        ========================================================= */

        :root {
            --bg: #07090e;
            --bg-card: #0d1017;
            --bg-input: #10141d;
            --bg-input-hover: #121721;

            --border: #222733;
            --border-hover: #303746;

            --primary: #725cff;
            --primary-hover: #8170ff;
            --primary-soft: rgba(114, 92, 255, .12);

            --text: #f7f8fb;
            --text-secondary: #b8bdc8;
            --text-muted: #7d8493;
            --text-dim: #535a68;

            --success: #4ed994;

            --radius-sm: 7px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            overflow-x: hidden;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }

        .background::before {
            content: "";

            position: absolute;

            width: 650px;
            height: 650px;

            top: -300px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(114, 92, 255, .13) 0%,
                    rgba(114, 92, 255, .04) 35%,
                    transparent 70%
                );

            filter: blur(15px);
        }

        .background::after {
            content: "";

            position: absolute;
            inset: 0;

            opacity: .22;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 75%
                );
        }


        /* =========================================================
           AUTH
        ========================================================= */

        .auth {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 430px;
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-bottom: 28px;
        }

        .brand-mark {
            width: 31px;
            height: 31px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #9181ff,
                    #6048e8
                );

            color: white;

            font-size: 11px;
            font-weight: 900;

            box-shadow:
                0 7px 24px
                rgba(114, 92, 255, .25);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 850;

            letter-spacing: -1px;
        }

        .brand-name span {
            color: var(--primary-hover);
        }


        /* =========================================================
           CARD
        ========================================================= */

        .card {
            position: relative;

            padding: 36px;

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,.075);

            border-radius: var(--radius-lg);

            background:
                linear-gradient(
                    180deg,
                    rgba(18, 22, 31, .96),
                    rgba(12, 15, 22, .98)
                );

            box-shadow:
                0 30px 80px rgba(0,0,0,.35),
                0 1px 0 rgba(255,255,255,.025) inset;
        }

        /* 카드 상단의 아주 약한 highlight */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(145,129,255,.35),
                    transparent
                );
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            margin-bottom: 28px;
        }

        .eyebrow {
            margin-bottom: 9px;

            color: var(--primary-hover);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.8px;
        }

        .header h1 {
            font-size: 27px;

            line-height: 1.25;

            letter-spacing: -1.3px;

            font-weight: 800;
        }

        .header p {
            margin-top: 9px;

            color: var(--text-muted);

            font-size: 11px;

            line-height: 1.65;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form {
            display: flex;
            flex-direction: column;

            gap: 17px;
        }

        .field {
            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .field-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .field-header label {
            color: var(--text-secondary);

            font-size: 10px;
            font-weight: 700;
        }

        .forgot {
            color: var(--text-muted);

            font-size: 9px;

            transition: color .18s ease;
        }

        .forgot:hover {
            color: var(--primary-hover);
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            outline: none;

            border:
                1px solid var(--border);

            border-radius: var(--radius-sm);

            background: var(--bg-input);
            color: var(--text);

            font-size: 12px;

            transition:
                border-color .18s ease,
                background .18s ease,
                box-shadow .18s ease;
        }

        .input:hover {
            border-color: var(--border-hover);
            background: var(--bg-input-hover);
        }

        .input:focus {
            border-color: var(--primary);

            background: var(--bg-input-hover);

            box-shadow:
                0 0 0 3px
                var(--primary-soft);
        }

        .input::placeholder {
            color: var(--text-dim);
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: -1px;
        }

        .check {
            display: flex;
            align-items: center;

            gap: 7px;

            color: var(--text-muted);

            font-size: 9px;

            cursor: pointer;
        }

        .check input {
            width: 14px;
            height: 14px;

            margin: 0;

            accent-color: var(--primary);

            cursor: pointer;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .submit {
            width: 100%;
            height: 46px;

            margin-top: 2px;

            border-radius: var(--radius-sm);

            background: var(--primary);

            color: white;

            font-size: 11px;
            font-weight: 750;

            transition:
                background .18s ease,
                transform .18s ease,
                box-shadow .18s ease;
        }

        .submit:hover {
            background: var(--primary-hover);

            transform: translateY(-1px);

            box-shadow:
                0 10px 28px
                rgba(114, 92, 255, .22);
        }

        .submit:active {
            transform: translateY(0);
        }


        /* =========================================================
           DIVIDER
        ========================================================= */

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0 20px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,.055);
        }

        .divider span {
            color: var(--text-dim);

            font-size: 8px;
            font-weight: 700;

            letter-spacing: 1px;
        }


        /* =========================================================
           REGISTER LINK
        ========================================================= */

        .bottom {
            text-align: center;

            color: var(--text-muted);

            font-size: 10px;
        }

        .bottom a {
            margin-left: 5px;

            color: var(--primary-hover);

            font-weight: 700;

            transition: color .18s ease;
        }

        .bottom a:hover {
            color: #a197ff;
        }


        /* =========================================================
           COPYRIGHT
        ========================================================= */

        .copyright {
            margin-top: 20px;

            color: #383e4a;

            text-align: center;

            font-size: 8px;

            letter-spacing: .2px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            body {
                padding: 24px 16px;
            }

            .card {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 24px;
            }

            .brand {
                margin-bottom: 24px;
            }
        }
    </style>
</head>


<body>

    <div class="background"></div>


    <main class="auth">

        <!-- BRAND -->

        <a href="login.html" class="brand">

            <span class="brand-mark">
                P
            </span>

            <span class="brand-name">
                PLAY<span>GROUND</span>
            </span>

        </a>


        <!-- CARD -->

        <section class="card">

            <header class="header">

                <div class="eyebrow">
                    WELCOME BACK
                </div>

                <h1>
                    다시 만나서 반가워요
                </h1>

                <p>
                    PLAYGROUND 계정으로 로그인하고<br>
                    게임을 계속 즐겨보세요.
                </p>

            </header>


            <form class="form">

                <!-- EMAIL -->

                <div class="field">

                    <div class="field-header">

                        <label for="email">
                            이메일
                        </label>

                    </div>

                    <input
                        id="email"
                        class="input"
                        type="email"
                        placeholder="이메일을 입력하세요"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <div class="field-header">

                        <label for="password">
                            비밀번호
                        </label>

                        <a href="#" class="forgot">
                            비밀번호 찾기
                        </a>

                    </div>

                    <input
                        id="password"
                        class="input"
                        type="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label class="check">

                        <input type="checkbox">

                        <span>
                            로그인 상태 유지
                        </span>

                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit"
                >
                    로그인
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <div class="bottom">

                아직 계정이 없으신가요?

                <a href="register.html">
                    회원가입
                </a>

            </div>

        </section>


        <p class="copyright">
            © 2026 PLAYGROUND
        </p>

    </main>

</body>
</html>
