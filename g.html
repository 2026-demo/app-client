<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>이메일 인증 | PLAYGROUND</title>

    <style>
        /* =========================================================
           DESIGN SYSTEM
        ========================================================= */

        :root {
            --bg: #07090e;
            --bg-card: #0d1017;
            --bg-input: #10141d;
            --bg-input-hover: #121721;
            color: #10141dbe;
            --border: #222733;
            --border-hover: #303746;

            --primary: #725cff;
            --primary-hover: #8170ff;
            --primary-soft: rgba(114, 92, 255, .12);

            --text: #f7f8fb;
            --text-secondary: #b8bdc8;
            --text-muted: #7d8493;
            --text-dim: #535a68;

            --radius-sm: 7px;
            --radius-lg: 16px;
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            overflow-x: hidden;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }

        .background::before {
            content: "";

            position: absolute;

            width: 650px;
            height: 650px;

            top: -300px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(114, 92, 255, .13) 0%,
                    rgba(114, 92, 255, .04) 35%,
                    transparent 70%
                );

            filter: blur(15px);
        }

        .background::after {
            content: "";

            position: absolute;
            inset: 0;

            opacity: .22;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black,
                    transparent 75%
                );
        }


        /* =========================================================
           AUTH
        ========================================================= */

        .auth {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 430px;
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-bottom: 28px;
        }

        .brand-mark {
            width: 31px;
            height: 31px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #9181ff,
                    #6048e8
                );

            color: white;

            font-size: 11px;
            font-weight: 900;

            box-shadow:
                0 7px 24px
                rgba(114, 92, 255, .25);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 850;

            letter-spacing: -1px;
        }

        .brand-name span {
            color: var(--primary-hover);
        }


        /* =========================================================
           CARD
        ========================================================= */

        .card {
            position: relative;

            padding: 36px;

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,.075);

            border-radius: var(--radius-lg);

            background:
                linear-gradient(
                    180deg,
                    rgba(18, 22, 31, .96),
                    rgba(12, 15, 22, .98)
                );

            box-shadow:
                0 30px 80px rgba(0,0,0,.35),
                0 1px 0 rgba(255,255,255,.025) inset;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(145,129,255,.35),
                    transparent
                );
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            margin-bottom: 27px;
        }

        .eyebrow {
            margin-bottom: 9px;

            color: var(--primary-hover);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.8px;
        }

        .header h1 {
            font-size: 27px;

            line-height: 1.25;

            letter-spacing: -1.3px;

            font-weight: 800;
        }

        .header p {
            margin-top: 10px;

            color: var(--text-muted);

            font-size: 11px;

            line-height: 1.7;
        }


        /* =========================================================
           EMAIL INFO
        ========================================================= */

        .email-box {
            display: flex;
            align-items: center;

            gap: 11px;

            margin-bottom: 20px;

            padding: 12px;

            border:
                1px solid rgba(255,255,255,.055);

            border-radius: 8px;

            background:
                rgba(255,255,255,.018);
        }

        .email-icon {
            width: 32px;
            height: 32px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background: var(--primary-soft);

            color: var(--primary-hover);

            font-size: 13px;
        }

        .email-content {
            min-width: 0;
        }

        .email-label {
            margin-bottom: 3px;

            color: var(--text-dim);

            font-size: 8px;

            letter-spacing: .6px;
        }

        .email-address {
            overflow: hidden;

            color: var(--text-secondary);

            font-size: 10px;

            font-weight: 600;

            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /* =========================================================
           CODE INPUT
        ========================================================= */

        .field {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .field-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .field-header label {
            color: var(--text-secondary);

            font-size: 10px;
            font-weight: 700;
        }

        .timer {
            color: var(--primary-hover);

            font-size: 9px;

            font-variant-numeric: tabular-nums;
        }


        .code-input {
            width: 100%;
            height: 54px;

            padding: 0 14px;

            border:
                1px solid var(--border);

            border-radius: var(--radius-sm);

            outline: none;

            background: var(--bg-input);
            color: var(--text);

            text-align: center;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: 9px;

            font-variant-numeric: tabular-nums;

            transition:
                border-color .18s ease,
                background .18s ease,
                box-shadow .18s ease;
        }

        .code-input:hover {
            border-color: var(--border-hover);

            background: var(--bg-input-hover);
        }

        .code-input:focus {
            border-color: var(--primary);

            background: var(--bg-input-hover);

            box-shadow:
                0 0 0 3px
                var(--primary-soft);
        }

        .code-input::placeholder {
            color: var(--text-dim);

            letter-spacing: 6px;
        }


        /* =========================================================
           HELPER
        ========================================================= */

        .helper {
            margin-top: 8px;

            color: var(--text-dim);

            font-size: 9px;

            line-height: 1.6;
        }


        /* =========================================================
           VERIFY BUTTON
        ========================================================= */

        .submit {
            width: 100%;
            height: 46px;

            margin-top: 19px;

            border-radius: var(--radius-sm);

            background: var(--primary);

            color: white;

            font-size: 11px;
            font-weight: 750;

            transition:
                background .18s ease,
                transform .18s ease,
                box-shadow .18s ease;
        }

        .submit:hover {
            background: var(--primary-hover);

            transform: translateY(-1px);

            box-shadow:
                0 10px 28px
                rgba(114, 92, 255, .22);
        }

        .submit:active {
            transform: translateY(0);
        }


        /* =========================================================
           RESEND
        ========================================================= */

        .resend {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;

            margin-top: 19px;

            color: var(--text-muted);

            font-size: 9px;
        }

        .resend button {
            padding: 0;

            background: transparent;

            color: var(--text-secondary);

            font-size: 9px;
            font-weight: 600;

            transition: color .18s ease;
        }

        .resend button:hover {
            color: var(--primary-hover);
        }

        .resend button:disabled {
            color: var(--text-dim);

            cursor: not-allowed;
        }


        /* =========================================================
           CHANGE EMAIL
        ========================================================= */

        .change-email {
            display: block;

            margin-top: 16px;

            color: var(--text-dim);

            text-align: center;

            font-size: 9px;

            transition: color .18s ease;
        }

        .change-email:hover {
            color: var(--text-secondary);
        }


        /* =========================================================
           COPYRIGHT
        ========================================================= */

        .copyright {
            margin-top: 20px;

            color: #383e4a;

            text-align: center;

            font-size: 8px;

            letter-spacing: .2px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            body {
                padding: 24px 16px;
            }

            .card {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 24px;
            }

            .brand {
                margin-bottom: 24px;
            }

            .code-input {
                height: 52px;

                font-size: 19px;

                letter-spacing: 7px;
            }
        }
    </style>
</head>


<body>

    <div class="background"></div>


    <main class="auth">

        <!-- =====================================================
             BRAND
        ====================================================== -->

        <a href="login.html" class="brand">

            <span class="brand-mark">
                P
            </span>

            <span class="brand-name">
                PLAY<span>GROUND</span>
            </span>

        </a>


        <!-- =====================================================
             CARD
        ====================================================== -->

        <section class="card">

            <!-- HEADER -->

            <header class="header">

                <div class="eyebrow">
                    VERIFY EMAIL
                </div>

                <h1>
                    이메일을 확인해주세요
                </h1>

                <p>
                    입력하신 이메일로 인증코드를 보내드렸습니다.<br>
                    아래에 6자리 인증코드를 입력해주세요.
                </p>

            </header>


            <!-- EMAIL -->

            <div class="email-box">

                <div class="email-icon">
                    @
                </div>

                <div class="email-content">

                    <div class="email-label">
                        VERIFICATION EMAIL
                    </div>

                    <div
                        class="email-address"
                        id="email"
                    >
                        example@email.com
                    </div>

                </div>

            </div>


            <!-- FORM -->

            <form id="verify-form">

                <div class="field">

                    <div class="field-header">

                        <label for="code">
                            인증코드
                        </label>

                        <span
                            class="timer"
                            id="timer"
                        >
                            03:00
                        </span>

                    </div>


                    <input
                        id="code"
                        class="code-input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        placeholder="••••••"
                        required
                    >


                    <p class="helper">
                        인증코드는 발송 후 3분 동안 유효합니다.
                    </p>

                </div>


                <button
                    type="submit"
                    class="submit"
                >
                    인증하기
                </button>

            </form>


            <!-- RESEND -->

            <div class="resend">

                <span>
                    인증코드를 받지 못하셨나요?
                </span>

                <button
                    type="button"
                    id="resend"
                    disabled
                >
                    재전송
                </button>

            </div>


            <!-- CHANGE EMAIL -->

            <a
                href="register.html"
                class="change-email"
            >
                이메일 주소 변경
            </a>

        </section>


        <p class="copyright">
            © 2026 PLAYGROUND
        </p>

    </main>


    <script>

        /* =========================================================
           EMAIL
        ========================================================= */

        /*
         * 실제 서비스에서는 회원가입 과정에서 입력한
         * 이메일을 서버 또는 세션을 통해 받아오면 된다.
         *
         * 예:
         *
         * document.querySelector("#email").textContent =
         *     sessionStorage.getItem("signupEmail");
         */

        const email =
            document.querySelector("#email");

        const signupEmail =
            sessionStorage.getItem("signupEmail");

        if (signupEmail) {
            email.textContent = signupEmail;
        }


        /* =========================================================
           CODE INPUT
        ========================================================= */

        const codeInput =
            document.querySelector("#code");


        /*
         * 숫자만 입력
         */

        codeInput.addEventListener(
            "input",
            () => {

                codeInput.value =
                    codeInput.value
                        .replace(/\D/g, "")
                        .slice(0, 6);

            }
        );


        /* =========================================================
           TIMER
        ========================================================= */

        const timer =
            document.querySelector("#timer");

        const resend =
            document.querySelector("#resend");


        let remaining = 180;


        function updateTimer() {

            const minutes =
                Math.floor(remaining / 60);

            const seconds =
                remaining % 60;


            timer.textContent =
                `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


            if (remaining <= 0) {

                timer.textContent =
                    "만료됨";

                resend.disabled =
                    false;

                return;

            }


            remaining--;

        }


        updateTimer();


        const timerInterval =
            setInterval(
                updateTimer,
                1000
            );


        /* =========================================================
           RESEND
        ========================================================= */

        resend.addEventListener(
            "click",
            () => {

                /*
                 * 실제 서비스에서는 여기서
                 * 인증코드 재발송 API를 호출한다.
                 */


                remaining = 180;

                resend.disabled = true;

                updateTimer();

            }
        );


        /* =========================================================
           FORM
        ========================================================= */

        const form =
            document.querySelector("#verify-form");


        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                const code =
                    codeInput.value;


                if (code.length !== 6) {

                    codeInput.focus();

                    return;

                }


                /*
                 * 실제 서비스에서는 여기서
                 *
                 * POST /api/auth/email/verify
                 *
                 * 같은 API를 호출하면 된다.
                 *
                 * 인증 성공 후:
                 *
                 * location.href = "login.html";
                 */


                alert("이메일 인증이 완료되었습니다.");

                location.href =
                    "login.html";

            }
        );

    </script>

</body>
</html>
